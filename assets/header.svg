<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Alejandro Domínguez — Artificial intelligence and applied mathematics</title>
  <desc id="desc">A dark blue banner with a teal geometric illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111e30"/>
      <stop offset="1" stop-color="#09121f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b7c9df" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="bounds"><rect width="1280" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="300" fill="url(#background)"/>
    <rect x="790" width="490" height="300" fill="url(#grid)"/>
    <circle cx="1110" cy="150" r="178" fill="none" stroke="#75d4c7" stroke-opacity=".12"/>
    <circle cx="1110" cy="150" r="132" fill="none" stroke="#75d4c7" stroke-opacity=".18"/>
    <ellipse cx="1080" cy="156" rx="175" ry="77" transform="rotate(-28 1080 156)" fill="none" stroke="#75d4c7" stroke-opacity=".40"/>
    <ellipse cx="1080" cy="156" rx="139" ry="44" transform="rotate(-28 1080 156)" fill="none" stroke="#75d4c7" stroke-opacity=".60"/>
    <path d="M880 243 L1238 60" fill="none" stroke="#75d4c7" stroke-opacity=".24"/>
    <path d="M970 38 L1190 270" fill="none" stroke="#bacbe1" stroke-opacity=".12"/>
    <g fill="#75d4c7">
      <circle cx="968" cy="213" r="4"/>
      <circle cx="1040" cy="174" r="4"/>
      <circle cx="1110" cy="139" r="5"/>
      <circle cx="1184" cy="99" r="4"/>
    </g>
    <rect x="58" y="54" width="34" height="4" rx="2" fill="#75d4c7"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="58" y="132" fill="#f0f5fa" font-size="55" font-weight="650" letter-spacing="-1.5">Alejandro Domínguez</text>
      <text x="60" y="180" fill="#75d4c7" font-size="25" font-weight="400">Artificial intelligence &amp; applied mathematics</text>
      <text x="60" y="244" fill="#a2b2c6" font-size="17" letter-spacing="1.1">ECONOMICS · MATHEMATICS · DATA SCIENCE</text>
    </g>
  </g>
</svg>
